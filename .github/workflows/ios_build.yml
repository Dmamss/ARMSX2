name: iOS Build

on:
  push:
    branches:
      - master
      - 'claude/ios-*'
    paths:
      - 'ios/**'
      - '.github/workflows/ios_build.yml'
    paths-ignore:
      - '**/*.md'

  pull_request:
    branches:
      - master
    paths:
      - 'ios/**'
    paths-ignore:
      - '**/*.md'

  workflow_dispatch:

env:
  # Build configuration
  XCODE_VERSION: '16.0'
  IOS_DEPLOYMENT_TARGET: '15.0'

  # Xcode common build arguments
  XCODE_COMMON_ARGS: >
    -project ios/ARMSX2.xcodeproj
    -scheme ARMSX2
    -sdk iphoneos
    -destination 'generic/platform=iOS'
    CODE_SIGN_IDENTITY=""
    CODE_SIGNING_REQUIRED=NO
    CODE_SIGNING_ALLOWED=NO
    ONLY_ACTIVE_ARCH=NO

jobs:
  format-check:
    name: 🎨 Code Format Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 📦 Install clang-format
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format

      - name: ℹ️ Check clang-format version
        run: clang-format --version

      - name: 🔍 Run clang-format check
        run: |
          cd ios
          echo "🔍 Checking Objective-C/C++ files for formatting issues..."

          # Find all .h, .m, .mm files
          FILES=$(find ARMSX2 -type f \( -name "*.h" -o -name "*.m" -o -name "*.mm" \) ! -path "*/build/*" ! -path "*/DerivedData/*")
          FILE_COUNT=$(echo "$FILES" | wc -l | tr -d ' ')
          echo "📁 Found $FILE_COUNT files to check"
          echo ""

          # Check each file
          FAILED=0
          FAILED_FILES=""
          for FILE in $FILES; do
            if ! clang-format --dry-run --Werror "$FILE" 2>/dev/null; then
              echo "❌ $FILE needs formatting"
              FAILED=1
              FAILED_FILES="$FAILED_FILES\n  - $FILE"
            fi
          done

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "❌ Format check failed! The following files need formatting:"
            echo -e "$FAILED_FILES"
            echo ""
            echo "🔧 To fix all files at once:"
            echo "  cd ios"
            echo "  ./scripts/format-code.sh"
            echo ""
            exit 1
          fi

          echo "✅ All $FILE_COUNT files are properly formatted!"

      - name: 📋 Generate format diff (if failed)
        if: failure()
        run: |
          cd ios
          echo "📋 Showing required formatting changes:"
          FILES=$(find ARMSX2 -type f \( -name "*.h" -o -name "*.m" -o -name "*.mm" \) ! -path "*/build/*")
          for FILE in $FILES; do
            if ! clang-format --dry-run --Werror "$FILE" 2>/dev/null; then
              echo ""
              echo "=== Diff for $FILE ==="
              clang-format "$FILE" | diff -u "$FILE" - || true
            fi
          done

  build:
    name: 🔨 Build iOS App
    needs: format-check
    runs-on: macos-14

    strategy:
      matrix:
        configuration: [Debug, Release]

    env:
      CONFIGURATION: ${{ matrix.configuration }}

    outputs:
      bundle_id: ${{ steps.app_info.outputs.BUNDLE_ID }}
      version: ${{ steps.app_info.outputs.VERSION }}
      build_number: ${{ steps.app_info.outputs.BUILD_NUMBER }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 🔧 Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: ℹ️ Display build environment
        run: |
          echo "🔧 Build Environment:"
          echo "  Xcode: $(xcodebuild -version | head -1)"
          echo "  Configuration: ${{ env.CONFIGURATION }}"
          echo "  iOS Deployment: ${{ env.IOS_DEPLOYMENT_TARGET }}+"
          echo ""
          xcodebuild -showsdks | grep -i ios

      - name: 📋 Get app info
        id: app_info
        run: |
          cd ios
          BUNDLE_ID=$(grep -A1 'CFBundleIdentifier' ARMSX2/Info.plist | grep string | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          VERSION=$(grep -A1 'CFBundleShortVersionString' ARMSX2/Info.plist | grep string | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          BUILD_NUMBER=$(grep -A1 'CFBundleVersion' ARMSX2/Info.plist | grep string | sed 's/.*<string>\(.*\)<\/string>.*/\1/')

          echo "BUNDLE_ID=$BUNDLE_ID" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT

          echo "📱 App Info:"
          echo "  Bundle ID: $BUNDLE_ID"
          echo "  Version: $VERSION ($BUILD_NUMBER)"

      - name: ✅ Verify deployment target
        run: |
          cd ios
          DEPLOYMENT_TARGET=$(grep CMAKE_OSX_DEPLOYMENT_TARGET CMakeLists.txt | head -1 | grep -o '"[0-9.]*"' | tr -d '"')
          echo "📱 Deployment Target: iOS $DEPLOYMENT_TARGET"

          if [ "$DEPLOYMENT_TARGET" = "15.0" ]; then
            echo "✅ iOS 15.0+ deployment (95% device compatibility)"
          else
            echo "⚠️ Deployment target is $DEPLOYMENT_TARGET (expected 15.0)"
          fi

      - name: 🗂️ Cache DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            ios/build
          key: ${{ runner.os }}-xcode-${{ env.CONFIGURATION }}-${{ hashFiles('ios/**/*.h', 'ios/**/*.m', 'ios/**/*.mm', 'ios/**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-${{ env.CONFIGURATION }}-
            ${{ runner.os }}-xcode-

      - name: 🔨 Build iOS App (${{ env.CONFIGURATION }})
        run: |
          echo "🔨 Building ARMSX2 for iOS (${{ env.CONFIGURATION }})..."
          xcodebuild clean build \
            ${{ env.XCODE_COMMON_ARGS }} \
            -configuration ${{ env.CONFIGURATION }} \
            | xcpretty && exit ${PIPESTATUS[0]} || true

      - name: 🔨 Build iOS Simulator
        if: matrix.configuration == 'Debug'
        run: |
          echo "🔨 Building for iOS Simulator..."
          xcodebuild clean build \
            -project ios/ARMSX2.xcodeproj \
            -scheme ARMSX2 \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | xcpretty && exit ${PIPESTATUS[0]} || true

      - name: 📦 Create unsigned IPA
        if: matrix.configuration == 'Debug'
        run: |
          echo "📦 Creating unsigned IPA for sideloading..."
          cd ios

          # Find the built app
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "ARMSX2.app" -path "*/Build/Products/Debug-iphoneos/*" | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "⚠️ App not found in DerivedData, checking local build directory..."
            APP_PATH=$(find build -name "ARMSX2.app" -path "*/Debug-iphoneos/*" | head -1)
          fi

          if [ -n "$APP_PATH" ]; then
            echo "📱 Found app at: $APP_PATH"

            # Create Payload directory
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/

            # Create IPA
            zip -r ARMSX2-iOS-Debug-Unsigned.ipa Payload
            rm -rf Payload

            echo "✅ IPA created: ARMSX2-iOS-Debug-Unsigned.ipa"
            ls -lh ARMSX2-iOS-Debug-Unsigned.ipa
          else
            echo "⚠️ Could not find built app"
          fi

      - name: 📤 Upload IPA artifact
        if: matrix.configuration == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: ARMSX2-iOS-Debug-Unsigned
          path: ios/ARMSX2-iOS-Debug-Unsigned.ipa
          if-no-files-found: warn
          retention-days: 30

      - name: 📊 Build Summary
        if: always()
        run: |
          echo "### 📊 Build Summary (${{ env.CONFIGURATION }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Configuration | ${{ env.CONFIGURATION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bundle ID | ${{ steps.app_info.outputs.BUNDLE_ID }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.app_info.outputs.VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Number | ${{ steps.app_info.outputs.BUILD_NUMBER }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Target | ${{ env.IOS_DEPLOYMENT_TARGET }}+ |" >> $GITHUB_STEP_SUMMARY
          echo "| Xcode | ${{ env.XCODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Build succeeded!" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed!" >> $GITHUB_STEP_SUMMARY
          fi

  release:
    name: 📦 Create Release
    needs: build
    if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/claude/ios-')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ARMSX2-iOS-Debug-Unsigned
          path: ./artifacts

      - name: 🏷️ Generate release info
        id: release_info
        run: |
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          VERSION="${{ needs.build.outputs.version }}"
          BUILD="${{ needs.build.outputs.build_number }}"

          TAG="ios-nightly-${VERSION}-${TIMESTAMP}"
          TITLE="iOS Nightly Build (v${VERSION} build ${BUILD}) - ${TIMESTAMP}"

          echo "RELEASE_TAG=$TAG" >> $GITHUB_OUTPUT
          echo "RELEASE_TITLE=$TITLE" >> $GITHUB_OUTPUT

          echo "📦 Release Info:"
          echo "  Tag: $TAG"
          echo "  Title: $TITLE"

      - name: 🚀 Create nightly release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.release_info.outputs.RELEASE_TAG }}
          name: ${{ steps.release_info.outputs.RELEASE_TITLE }}
          body: |
            ## ARMSX2 iOS Nightly Build

            **Version:** ${{ needs.build.outputs.version }} (build ${{ needs.build.outputs.build_number }})
            **Configuration:** Debug (Unsigned)
            **iOS Deployment:** 15.0+
            **Commit:** ${{ github.sha }}

            ### Installation

            This is an unsigned debug build. Install using:
            - **AltStore** (recommended for testing)
            - **Sideloadly**
            - **Xcode** (for development devices)

            ### Features

            - iOS 15.0+ support (95% device compatibility)
            - Automatic TXM detection (iOS 26+)
            - DolphinOS-style JIT with vm_remap mirroring
            - 2-6x faster JIT performance

            ### Notes

            This is a development build. JIT acquisition is not yet implemented - app requires jailbreak or debugger for JIT access.

            See Phase 2 roadmap for upcoming JIT acquisition support.
          draft: false
          prerelease: true
          files: |
            ./artifacts/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Release Summary
        run: |
          echo "### 📦 Release Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.release_info.outputs.RELEASE_TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "**Title:** ${{ steps.release_info.outputs.RELEASE_TITLE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Nightly release published successfully!" >> $GITHUB_STEP_SUMMARY
